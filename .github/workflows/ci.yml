name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # shortcut: build + vet only; add `make test-backend` once damast patches exist.
      - run: go build ./...
      - name: No new upstream migrations from us
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/')
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -E '^models/(forgejo_)?migrations/'; then
            echo "::error::Damast must not touch Forgejo's migration chain (breaks drop-in / back-to-Forgejo). Use damast_* tables."; exit 1
          fi

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # shortcut: full upstream suites run in Forgejo's CI; here only the build plus Damast's own tests.
      - run: go build ./...
      - name: Release version logic
        run: .github/scripts/version.sh self-test
      - name: No new upstream migrations from us
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/')
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -E '^models/(forgejo_)?migrations/'; then
            echo "::error::Damast must not touch Forgejo's migration chain (breaks drop-in / back-to-Forgejo). Use damast_* tables."; exit 1
          fi

  damast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -yq git-lfs && git lfs install --skip-repo
      - name: Unit tests
        run: go test -tags 'sqlite sqlite_unlock_notify' ./modules/damast/... ./models/damast/... ./services/damast/... ./modules/templates/... ./modules/translation/...
      - name: Integration tests (sqlite)
        run: make 'test-sqlite#TestDamast'

  # Lint and gofmt only what a PR changes; upstream code is Forgejo's responsibility (skipped on sync PRs).
  lint:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Base revision
        id: base
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "rev=$(git merge-base HEAD "origin/${{ github.base_ref }}")" >> "$GITHUB_OUTPUT"
      - name: gofmt (changed Go files)
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "${{ steps.base.outputs.rev }}" HEAD -- '*.go')
          [[ ${#files[@]} -eq 0 ]] && exit 0
          bad=$(gofmt -l "${files[@]}")
          [[ -z $bad ]] || { echo "::error::not gofmt-formatted: $bad"; exit 1; }
      - name: golangci-lint (new issues only)
        run: |
          pkg=$(sed -nE 's/^GOLANGCI_LINT_PACKAGE \?= ([^ ]+).*/\1/p' Makefile) # same version as Forgejo
          go run "$pkg" run --build-tags 'sqlite sqlite_unlock_notify' --new-from-rev "${{ steps.base.outputs.rev }}" ./...

  # Known vulnerabilities that the code actually reaches, in Damast's and Forgejo's dependencies.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck (fails on reachable findings not listed in .github/govulncheck-ignore.txt)
        run: |
          set +e
          go run "$(sed -nE 's/^GOVULNCHECK_PACKAGE \?= ([^ ]+).*/\1/p' Makefile)" ./... | tee vuln.txt
          rc=${PIPESTATUS[0]}
          set -e
          [[ $rc -eq 0 ]] && exit 0
          [[ $rc -eq 3 ]] || { echo "::error::govulncheck failed to run (exit $rc)"; exit "$rc"; }
          new=$(grep -oE '^Vulnerability #[0-9]+: GO-[0-9]+-[0-9]+' vuln.txt | awk '{print $3}' \
            | grep -vxF -f <(grep -oE '^GO-[0-9]+-[0-9]+' .github/govulncheck-ignore.txt) || true)
          [[ -z $new ]] || { echo "::error::unhandled vulnerabilities: $new"; exit 1; }

